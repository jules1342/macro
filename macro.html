    function SavedItemEditor({ item, existingFav, apiKey, onSetApiKey, onCancel, onSave, onSaveTemplate }) {
      const [entry, setEntry] = useState({
        name: item.name || '',
        portion: item.portion || '',
        calories: num(item.calories),
        protein: num(item.protein),
        carbs: num(item.carbs),
        fat: num(item.fat),
        imageData: item.imageData,
        labelData: item.labelData,
        source: item.source
      });

      const initialName = useRef(item.name || '');
      const initialPortion = useRef(item.portion || '');
      const [recalcing, setRecalcing] = useState(false);
      const [recalcErr, setRecalcErr] = useState(null);
      const [templateSaved, setTemplateSaved] = useState(false);

      const recalcMode = entry.source === 'label' ? 'label' : (entry.imageData ? 'vision' : 'text');
      const canRescale = !!(entry.labelData && (entry.labelData.per_100g?.calories != null || (entry.labelData.per_serving?.calories != null && entry.labelData.serving_size_g)));
      const hasPer100 = !!(entry.labelData?.per_100g);

      const descriptionChanged =
        entry.name !== initialName.current ||
        entry.portion !== initialPortion.current;

      // Per-100g edits track separately so they don't trigger AI recalc on "Add to log"
      const initialLabelData = useRef(item.labelData || null);
      const labelChanged = JSON.stringify(initialLabelData.current) !== JSON.stringify(entry.labelData);

      const willRecalcOnSave = recalcMode !== 'label' && descriptionChanged;

      const applyLabelRescale = (patch) => {
        setEntry(prev => ({ ...prev, ...patch }));
        initialPortion.current = patch.portion || initialPortion.current;
      };

      const handleSave = async () => {
        if (!willRecalcOnSave) {
          onSave(entry);
          return;
        }
        if (!apiKey) {
          onSave(entry);
          return;
        }
        setRecalcing(true);
        setRecalcErr(null);
        try {
          const recalced = await recalcMacrosForEntry(entry, apiKey);
          onSave({
            ...entry,
            portion: recalced.portion,
            calories: recalced.calories,
            protein: recalced.protein,
            carbs: recalced.carbs,
            fat: recalced.fat,
            labelData: recalced.labelData,
          });
        } catch (e) {
          logError('saved_recalc', e, null);
          setRecalcErr(classifyError(e).kind === 'no_key' ? 'NO_KEY' : errLine(e));
          setRecalcing(false);
        }
      };

      // Save changes back to the saved template (favourite). Recalc first if description changed.
      const handleSaveTemplate = async () => {
        const doSave = (finalEntry) => {
          onSaveTemplate({
            id: existingFav?.id,
            name: finalEntry.name,
            portion: finalEntry.portion,
            calories: finalEntry.calories,
            protein: finalEntry.protein,
            carbs: finalEntry.carbs,
            fat: finalEntry.fat,
            imageData: finalEntry.imageData,
            labelData: finalEntry.labelData,
            source: finalEntry.source,
          });
        };
        if (!willRecalcOnSave || !apiKey) {
          doSave(entry);
          return;
        }
        setRecalcing(true);
        setRecalcErr(null);
        try {
          const recalced = await recalcMacrosForEntry(entry, apiKey);
          doSave({
            ...entry,
            portion: recalced.portion,
            calories: recalced.calories,
            protein: recalced.protein,
            carbs: recalced.carbs,
            fat: recalced.fat,
            labelData: recalced.labelData,
          });
        } catch (e) {
          logError('saved_recalc', e, null);
          setRecalcErr(classifyError(e).kind === 'no_key' ? 'NO_KEY' : errLine(e));
          setRecalcing(false);
        }
      };

      const templateBtnLabel = existingFav
        ? (recalcing ? 'Saving...' : 'Update saved version')
        : (recalcing ? 'Saving...' : 'Save as new favourite');

      return (
        <div>
          <button onClick={onCancel} style={{ ...secondaryBtn, marginTop: 0, marginBottom: 12 }}>← Back to saved meals</button>
          {item.imageData && <ZoomablePreview src={item.imageData} maxHeight={180}/>}
          {canRescale && (
            <LabelRescaler
              labelData={entry.labelData}
              onApply={applyLabelRescale}
              currentPortion={entry.portion}/>
          )}
          {hasPer100 && (
            <Per100gReferenceEditor
              labelData={entry.labelData}
              onChange={(ld) => setEntry(prev => ({ ...prev, labelData: ld }))}/>
          )}
          <EditableResult
            result={entry} setResult={setEntry}
            meta={
              <>
                {willRecalcOnSave && (
                  <div style={{ fontSize: 11, color: C.accent, marginTop: 8, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 6 }}>
                    <IconLoader size={12}/>
                    <span>
                      {recalcMode === 'vision'
                        ? 'Macros will be recalculated against the original photo when you save'
                        : 'Macros will be recalculated when you save'}
                    </span>
                  </div>
                )}
                {recalcMode === 'label' && descriptionChanged && (
                  <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 8, marginBottom: 4, fontStyle: 'italic' }}>
                    Text saved as-is. To change macros, use the re-scale widget above.
                  </div>
                )}
              </>
            }
            onSave={handleSave}
            saving={recalcing}
            saveLabel={recalcing ? 'Recalculating...' : (willRecalcOnSave ? 'Add to log & recalculate' : "Add to today's log")}
            showPortion
          />

          <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 6, textAlign: 'center' }}>
            Adds a new log entry. Your saved meal stays unchanged.
          </div>

          {/* Separate, optional action: overwrite the saved meal itself */}
          <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14, marginTop: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 500, color: C.ink, marginBottom: 2 }}>
              {existingFav ? 'Saved meal' : 'Save as favourite'}
            </div>
            <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 10, lineHeight: 1.45 }}>
              {existingFav
                ? 'Only use this if you want these edits to become the new saved version. It does not add anything to your log.'
                : 'Save these details as a reusable favourite. It does not add anything to your log.'}
            </div>
            <button onClick={handleSaveTemplate} disabled={recalcing}
              style={{ ...secondaryBtn, marginTop: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
              {recalcing && <IconLoader size={14}/>}
              {templateBtnLabel}
            </button>
          </div>

          {recalcErr === 'NO_KEY' && (
            <div style={{ marginTop: 10 }}><ApiKeyPrompt onSet={onSetApiKey}/></div>
          )}
          {recalcErr && recalcErr !== 'NO_KEY' && (
            <>
              <div style={{ ...errBox, marginTop: 10 }}>
                <IconAlert size={16}/>
                <span>Recalc failed: {recalcErr}</span>
              </div>
              <button onClick={() => { setRecalcErr(null); onSave(entry); }}
                style={{ ...secondaryBtn, marginTop: 8 }}>
                Save without recalculating
              </button>
            </>
          )}
        </div>
      );
    }

    // Shared: rescale calories/macros from a labelData object given grams eaten.
    // Returns updated patch or null if rescaling not possible.
    const rescaleFromLabel = (labelData, grams) => {
      const g = num(grams);
      if (!g || !labelData) return null;
      // Prefer the printed per-serving values (authoritative, no drift), same
      // as the capture flow. Fall back to per-100g.
      const per = labelData.per_serving;
      if (per && per.calories != null && labelData.serving_size_g) {
        const f = g / labelData.serving_size_g;
        return {
          portion: `${g}g`,
          calories: Math.round(per.calories * f),
          protein: Math.round((per.protein_g || 0) * f),
          carbs: Math.round((per.carbs_g || 0) * f),
          fat: Math.round((per.fat_g || 0) * f),
        };
      }
      const per100 = labelData.per_100g;
      if (per100 && per100.calories != null) {
        const f = g / 100;
        return {
          portion: `${g}g`,
          calories: Math.round(per100.calories * f),
          protein: Math.round((per100.protein_g || 0) * f),
          carbs: Math.round((per100.carbs_g || 0) * f),
          fat: Math.round((per100.fat_g || 0) * f),
        };
      }
      return null;
    };

    // Shared: small UI for rescaling a label entry by grams.
    function LabelRescaler({ labelData, onApply, currentPortion }) {
      const [grams, setGrams] = useState('');
      const hasPer100 = labelData?.per_100g?.calories != null;
      const hasPerServing = labelData?.per_serving?.calories != null && labelData?.serving_size_g;
      if (!hasPer100 && !hasPerServing) return null;

      const apply = () => {
        const patch = rescaleFromLabel(labelData, grams);
        if (patch) {
          onApply(patch);
          setGrams('');
        }
      };

      // Build the basis line, showing full P/C/F per 100g where available
      let basisLine;
      if (hasPer100) {
        const p = labelData.per_100g;
        basisLine = (
          <>
            Per 100g: <b style={{ color: C.ink, fontWeight: 600 }}>{Math.round(p.calories)} kcal</b>
            {' · '}P {Math.round(p.protein_g || 0)}g
            {' · '}C {Math.round(p.carbs_g || 0)}g
            {' · '}F {Math.round(p.fat_g || 0)}g
          </>
        );
      } else {
        const p = labelData.per_serving;
        basisLine = (
          <>
            Per {labelData.serving_size_g}g: <b style={{ color: C.ink, fontWeight: 600 }}>{Math.round(p.calories)} kcal</b>
            {' · '}P {Math.round(p.protein_g || 0)}g
            {' · '}C {Math.round(p.carbs_g || 0)}g
            {' · '}F {Math.round(p.fat_g || 0)}g
          </>
        );
      }

      return (
        <div style={{ background: C.accentSoft, borderRadius: 10, padding: 14, marginBottom: 14 }}>
          <div style={{ fontSize: 12, color: C.accent, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600, marginBottom: 6 }}>
            Re-scale from reference
          </div>
          <div className="num" style={{ fontSize: 12, color: C.inkMuted, marginBottom: 4, lineHeight: 1.5 }}>
            {basisLine}
          </div>
          {currentPortion && (
            <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 10, fontStyle: 'italic' }}>
              Current: {currentPortion}
            </div>
          )}
          <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
            <div style={{ flex: 1 }}>
              <NumberInput value={grams} onChange={setGrams} suffix="g" small/>
            </div>
            <button onClick={apply} disabled={!grams}
              style={{ ...primaryBtn, marginTop: 0, width: 'auto', padding: '10px 16px', background: C.accent, opacity: grams ? 1 : 0.4 }}>
              Apply
            </button>
          </div>
        </div>
      );
    }

    // Shared: decide how to recalc and run it. Returns updated entry or throws.
    // Modes:
    //  - 'label'   → no API call, never recalc here (caller handles rescale UI)
    //  - 'vision'  → re-call vision API with stored image + new description as context
    //  - 'text'    → re-call describe API with name + portion
    const recalcMacrosForEntry = async (entry, apiKey) => {
      // Label entries: don't touch macros via Claude
      if (entry.labelData) return entry;
      const portionForApi = entry.portion ? entry.portion.replace(/\n/g, '; ') : '';
      const desc = portionForApi ? `${entry.name}. ${portionForApi}` : entry.name;

      let r;
      if (entry.imageData) {
        // Image is ground truth; pass user's new text as extra context (treated as supplementary correction)
        r = await analyseFoodImage(entry.imageData, apiKey, desc);
      } else {
        r = await analyseFoodDescription(desc, apiKey);
      }
      return {
        ...entry,
        name: entry.name,
        portion: r.portion_estimate || entry.portion,
        calories: num(r.calories, entry.calories),
        protein: num(r.protein_g, entry.protein),
        carbs: num(r.carbs_g, entry.carbs),
        fat: num(r.fat_g, entry.fat),
      };
    };

    // Apply a natural-language comment to an existing entry and return updated
    // values. Works for any entry type. Example comments: "two servings not
    // one", "add a tbsp of olive oil", "actually 300g not 200g", "no dressing".
    const applyCommentToEntry = async (entry, comment, apiKey) => {
      if (!apiKey) throw new Error('NO_API_KEY');
      const ld = entry.labelData;
      let refLines = '';
      if (ld?.per_100g?.calories != null) {
        refLines = `\nPer 100g reference from the product label: ${ld.per_100g.calories} kcal, P ${ld.per_100g.protein_g}g, C ${ld.per_100g.carbs_g}g, F ${ld.per_100g.fat_g}g. Use this to rescale accurately if the comment changes the amount eaten.`;
      } else if (ld?.per_serving?.calories != null && ld?.serving_size_g) {
        refLines = `\nPer serving reference (${ld.serving_size_g}g): ${ld.per_serving.calories} kcal, P ${ld.per_serving.protein_g}g, C ${ld.per_serving.carbs_g}g, F ${ld.per_serving.fat_g}g. Use this to rescale accurately if the comment changes the amount eaten.`;
      }
      const portionForApi = entry.portion ? entry.portion.replace(/\n/g, '; ') : '';
      const r = await callText(
`A user has logged this food and wants to adjust it based on a comment. Update the values to reflect the comment.

Current entry:
- Name: ${entry.name}
- Portion: ${portionForApi || '(not specified)'}
- Calories: ${num(entry.calories)} kcal
- Protein: ${num(entry.protein)}g, Carbs: ${num(entry.carbs)}g, Fat: ${num(entry.fat)}g${refLines}

User's comment: "${comment}"

${AU_CONTEXT}

How to apply the comment:
- "two servings not one" / "I had double" -> multiply portion and all macros accordingly.
- "add a tablespoon of olive oil" -> add that item's macros (~120 kcal, 14g fat for 1 tbsp olive oil).
- "actually 300g not 200g" -> rescale proportionally; use the per-100g reference above if present.
- "no dressing" / "without the rice" -> subtract that component's estimated contribution.
- If the comment only renames or clarifies, keep macros and update the name/portion text.
- Keep everything grounded and realistic. Preserve the entry's identity; only change what the comment implies.

${METHOD}

Return ONLY a JSON object (no markdown, no preamble):
{
  "name": "updated concise name in Australian English",
  "portion_estimate": "updated portion description (single line, or newline-separated ingredients if it's a list)",
  "calories": <integer kcal>,
  "protein_g": <integer>,
  "carbs_g": <integer>,
  "fat_g": <integer>,
  "note": "one short line summarising what changed"
}`,
        apiKey);
      return {
        name: r.name || entry.name,
        portion: r.portion_estimate || entry.portion,
        calories: num(r.calories, entry.calories),
        protein: num(r.protein_g, entry.protein),
        carbs: num(r.carbs_g, entry.carbs),
        fat: num(r.fat_g, entry.fat),
        note: r.note || '',
      };
    };

    function EditSheet({ entry, date, isFav, apiKey, onSetApiKey, onClose, onSave, onDelete, onToggleFav }) {
      const [updates, setUpdates] = useState({
        name: entry.name,
        portion: entry.portion || '',
        calories: num(entry.calories),
        protein: num(entry.protein),
        carbs: num(entry.carbs),
        fat: num(entry.fat),
      });
      const [newDate, setNewDate] = useState(date);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [recalcing, setRecalcing] = useState(false);
      const [recalcErr, setRecalcErr] = useState(null);
      const [comment, setComment] = useState('');
      const [commenting, setCommenting] = useState(false);
      const [commentErr, setCommentErr] = useState(null);
      const [commentNote, setCommentNote] = useState(null);

      const initialName = useRef(entry.name);
      const initialPortion = useRef(entry.portion || '');

      const applyComment = async () => {
        if (!comment.trim()) return;
        setCommenting(true); setCommentErr(null); setCommentNote(null);
        try {
          const candidate = { ...entry, ...updates };
          const r = await applyCommentToEntry(candidate, comment.trim(), apiKey);
          setUpdates(u => ({
            ...u,
            name: r.name,
            portion: r.portion,
            calories: r.calories,
            protein: r.protein,
            carbs: r.carbs,
            fat: r.fat,
          }));
          // Keep these as the new baseline so saving doesn't trigger a second recalc
          initialName.current = r.name;
          initialPortion.current = r.portion;
          setComment('');
          setCommentNote(r.note || 'Updated.');
        } catch (e) {
          logError('entry_comment', e, null);
          setCommentErr(classifyError(e).kind === 'no_key' ? 'NO_KEY' : errLine(e));
        } finally { setCommenting(false); }
      };

      // recalcMode: how text edits trigger a macros refresh
      //   'label'  → never (strict label scans)
      //   'vision' → re-call vision API with stored image + new description
      //   'text'   → re-call describe API
      const recalcMode = entry.source === 'label' ? 'label' : (entry.imageData ? 'vision' : 'text');
      // canRescale: does this entry have per-100g data to rescale from?
      const canRescale = !!(entry.labelData && (entry.labelData.per_100g?.calories != null || (entry.labelData.per_serving?.calories != null && entry.labelData.serving_size_g)));

      const descriptionChanged =
        updates.name !== initialName.current ||
        updates.portion !== initialPortion.current;

      const willRecalcOnSave = recalcMode !== 'label' && descriptionChanged;

      const applyLabelRescale = (patch) => {
        setUpdates(u => ({ ...u, ...patch }));
        initialPortion.current = patch.portion || initialPortion.current;
      };

      const finishSave = (extraUpdates = {}) => {
        const merged = { ...updates, ...extraUpdates };
        // Preserve labelData: use the explicitly-passed one (from recalc) or keep the existing entry's
        if (extraUpdates.labelData !== undefined) {
          merged.labelData = extraUpdates.labelData;
        } else if (entry.labelData) {
          merged.labelData = entry.labelData;
        }
        onSave(merged, newDate);
      };

      const handleSave = async () => {
        if (!willRecalcOnSave) {
          finishSave();
          return;
        }
        if (!apiKey) {
          finishSave();
          return;
        }
        setRecalcing(true);
        setRecalcErr(null);
        try {
          const candidate = { ...entry, ...updates };
          const recalced = await recalcMacrosForEntry(candidate, apiKey);
          finishSave({
            portion: recalced.portion,
            calories: recalced.calories,
            protein: recalced.protein,
            carbs: recalced.carbs,
            fat: recalced.fat,
            labelData: recalced.labelData,
          });
        } catch (e) {
          logError('entry_recalc', e, null);
          setRecalcErr(classifyError(e).kind === 'no_key' ? 'NO_KEY' : errLine(e));
          setRecalcing(false);
        }
      };

      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(27,24,21,0.4)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 50 }}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: C.bg, width: '100%', maxWidth: 600,
            borderRadius: '20px 20px 0 0', padding: '12px 18px 28px',
            maxHeight: '92vh', overflowY: 'auto',
            animation: 'slideup 0.3s ease-out',
            paddingBottom: 'calc(28px + env(safe-area-inset-bottom, 0))'
          }}>
            <div style={{ width: 36, height: 4, background: C.line, borderRadius: 2, margin: '6px auto 16px' }}/>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <h2 className="display" style={{ margin: 0, fontSize: 28, fontWeight: 500 }}>Edit entry</h2>
              <div style={{ display: 'flex', gap: 6 }}>
                <button onClick={onToggleFav} style={{
                  ...iconBtnStyle, color: isFav ? C.accent : C.inkMuted,
                  background: isFav ? C.accentSoft : C.bg,
                  borderColor: isFav ? C.accent : C.line
                }} aria-label="Favourite">
                  <span style={{ fontSize: 16, lineHeight: 1 }}>{isFav ? '★' : '☆'}</span>
                </button>
                <button onClick={onClose} style={iconBtnStyle}><IconX size={18}/></button>
              </div>
            </div>

            {entry.imageData && <ZoomablePreview src={entry.imageData} maxHeight={200}/>}

            <div style={{
              display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px',
              background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10,
              marginBottom: 14
            }}>
              <IconCalendar size={15}/>
              <span style={{ fontSize: 12, color: C.inkMuted, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 500 }}>Date</span>
              <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)}
                style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none', fontFamily: fonts.body, fontSize: 14, color: C.ink, padding: 0 }}/>
            </div>

            {canRescale && (
              <LabelRescaler
                labelData={entry.labelData}
                onApply={applyLabelRescale}
                currentPortion={updates.portion}/>
            )}

            <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: 18, marginBottom: 16 }}>
              <input value={updates.name} onChange={(e) => setUpdates({...updates, name: e.target.value})}
                style={{ background: 'transparent', border: 'none', width: '100%', fontFamily: fonts.display, fontSize: 22, fontWeight: 500, color: C.ink, outline: 'none', letterSpacing: '-0.02em' }}/>
              <textarea value={updates.portion} onChange={(e) => setUpdates({...updates, portion: e.target.value})}
                placeholder={recalcMode === 'label' ? "Notes (optional)" : "Serving size or ingredients (one per line)"}
                rows={Math.max(1, (updates.portion || '').split('\n').length)}
                style={{ background: 'transparent', border: 'none', width: '100%', fontSize: 13, color: C.inkMuted, outline: 'none', fontStyle: 'italic', marginTop: 4, resize: 'vertical', fontFamily: fonts.body, lineHeight: 1.4, padding: 0, boxSizing: 'border-box' }}/>
              {willRecalcOnSave && (
                <div style={{ fontSize: 11, color: C.accent, marginTop: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <IconLoader size={12}/>
                  <span>
                    {recalcMode === 'vision'
                      ? 'Macros will be recalculated against the original photo when you save'
                      : 'Macros will be recalculated when you save'}
                  </span>
                </div>
              )}
              {recalcMode === 'label' && descriptionChanged && (
                <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 8, fontStyle: 'italic' }}>
                  Text saved as-is. To change macros, use the re-scale widget above.
                </div>
              )}
              <div style={{ marginTop: 12, paddingTop: 14, borderTop: `1px solid ${C.line}` }}>
                <NumEdit label="Calories" value={updates.calories} onChange={(v) => setUpdates({...updates, calories: v})} suffix="kcal" big fullWidth/>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginTop: 14 }}>
                <NumEdit label="Protein" value={updates.protein} onChange={(v) => setUpdates({...updates, protein: v})} suffix="g"/>
                <NumEdit label="Carbs" value={updates.carbs} onChange={(v) => setUpdates({...updates, carbs: v})} suffix="g"/>
                <NumEdit label="Fat" value={updates.fat} onChange={(v) => setUpdates({...updates, fat: v})} suffix="g"/>
              </div>
            </div>

            {/* Adjust by comment: natural-language correction, AI recalculates */}
            <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 500, color: C.ink, marginBottom: 4 }}>Adjust with a comment</div>
              <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 10, lineHeight: 1.45 }}>
                Describe a change in plain words and Claude updates the numbers. e.g. "actually two servings", "add a tbsp of olive oil", "no dressing".
              </div>
              <textarea value={comment} onChange={(e) => setComment(e.target.value)}
                placeholder="What should change?"
                rows="2"
                style={{
                  width: '100%', padding: '10px 12px', borderRadius: 8,
                  border: `1px solid ${C.line}`, background: C.bg,
                  fontSize: 14, color: C.ink, outline: 'none', boxSizing: 'border-box',
                  resize: 'vertical', fontFamily: fonts.body, lineHeight: 1.4
                }}/>
              <button onClick={applyComment} disabled={!comment.trim() || commenting}
                style={{ ...primaryBtn, background: C.accent, marginTop: 10, opacity: (comment.trim() && !commenting) ? 1 : 0.4, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                {commenting && <IconLoader size={15}/>}
                {commenting ? 'Updating...' : 'Apply comment'}
              </button>
              {commentNote && !commenting && (
                <div style={{ fontSize: 12, color: C.green, marginTop: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <IconCheck size={13}/><span>{commentNote}</span>
                </div>
              )}
              {commentErr === 'NO_KEY' && (
                <div style={{ marginTop: 10 }}><ApiKeyPrompt onSet={onSetApiKey}/></div>
              )}
              {commentErr && commentErr !== 'NO_KEY' && (
                <div style={{ ...errBox, marginTop: 8 }}><IconAlert size={15}/><span>{commentErr}</span></div>
              )}
            </div>

            {recalcErr === 'NO_KEY' && (
              <div style={{ marginBottom: 10 }}><ApiKeyPrompt onSet={onSetApiKey}/></div>
            )}
            {recalcErr && recalcErr !== 'NO_KEY' && (
              <div style={{ ...errBox, marginBottom: 10 }}>
                <IconAlert size={16}/>
                <span>Recalc failed: {recalcErr}. Save anyway?</span>
              </div>
            )}

            <button onClick={handleSave} disabled={recalcing} style={{
              ...primaryBtn, opacity: recalcing ? 0.6 : 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8
            }}>
              {recalcing && <IconLoader size={16}/>}
              {recalcing ? 'Recalculating...' : (willRecalcOnSave ? 'Save & recalculate macros' : 'Save changes')}
            </button>

            {recalcErr && recalcErr !== 'NO_KEY' && (
              <button onClick={() => { setRecalcErr(null); finishSave(); }}
                style={{ ...secondaryBtn, marginTop: 8 }}>
                Save without recalculating
              </button>
            )}

            {!confirmDelete ? (
              <button onClick={() => setConfirmDelete(true)} style={{
                ...secondaryBtn, color: C.red, borderColor: C.red, marginTop: 10
              }}>Delete entry</button>
            ) : (
              <div style={{ marginTop: 10, display: 'flex', gap: 8 }}>
                <button onClick={onDelete} style={{ ...primaryBtn, marginTop: 0, background: C.red, flex: 1 }}>Confirm delete</button>
                <button onClick={() => setConfirmDelete(false)} style={{ ...secondaryBtn, marginTop: 0, flex: 1 }}>Cancel</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ApiKeyPrompt({ onSet }) {
      const [k, setK] = useState('');
      return (
        <div style={{ background: C.accentSoft, borderRadius: 12, padding: 18, marginBottom: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
            <IconKey size={16}/>
            <b style={{ fontSize: 14 }}>Anthropic API key needed</b>
          </div>
          <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 12, lineHeight: 1.5 }}>
            Vision calls (food/label photos) use the Anthropic API. Get a key at <b style={{color: C.ink}}>console.anthropic.com</b>, then paste it here. Stored only on this device.
          </div>
          <input type="password" value={k} onChange={(e) => setK(e.target.value)}
            placeholder="sk-ant-..."
            style={{ width: '100%', padding: '10px 12px', borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 14, marginBottom: 10, background: C.surface, boxSizing: 'border-box' }}/>
          <button onClick={() => k && onSet(k)} disabled={!k}
            style={{ ...primaryBtn, background: C.accent, marginTop: 0, opacity: k ? 1 : 0.4 }}>
            Save key
          </button>
        </div>
      );
    }

    // Photo capture for one analysis type. `fixedMode` ('food' | 'label')
    // locks which analysis runs and hides the toggle, so this renders as a
    // dedicated Photo tab or Label tab. Two equal sources: native camera and
    // file picker. No in-app camera (cannot focus on Samsung S22).
    // In-page camera via getUserMedia. No system camera Intent, so Android
    // never backgrounds and kills the page (the cause of the reload). On
    // multi-lens phones (S22+ has wide/ultrawide/telephoto) the default rear
    // camera is often the ultrawide, which is fixed-focus and can't focus on a
    // close label, so we enumerate and select the MAIN rear sensor (lowest
    // camera index) and request continuous autofocus. A lens switcher is the
    // manual fallback if the heuristic picks wrong.
    const cameraErrMsg = (e) => {
      const n = e && e.name;
      if (n === 'NotAllowedError' || n === 'SecurityError')
        return 'Camera access is blocked. Allow the camera for this site in Chrome settings, then reopen.';
      if (n === 'NotFoundError' || n === 'OverconstrainedError')
        return 'No usable camera was found on this device.';
      if (n === 'NotReadableError')
        return 'The camera is busy in another app. Close other camera apps and try again.';
      return (e && e.message) ? e.message : 'Could not start the camera.';
    };

    function InAppCamera({ onCapture, onCancel }) {
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const [cams, setCams] = useState([]);
      const [camIdx, setCamIdx] = useState(0);
      const [ready, setReady] = useState(false);
      const [err, setErr] = useState(null);
      const [busy, setBusy] = useState(false);
      const [canTapFocus, setCanTapFocus] = useState(false);
      const [reticle, setReticle] = useState(null);

      const stopStream = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
      };

      const tuneFocus = (stream) => {
        try {
          const track = stream.getVideoTracks()[0];
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.focusMode && caps.focusMode.includes('continuous')) {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
          }
          setCanTapFocus(!!(caps.focusMode || caps.pointsOfInterest));
        } catch (_) {}
      };

      const open = async (deviceId) => {
        stopStream();
        const base = { width: { ideal: 2560 }, height: { ideal: 1440 }, advanced: [{ focusMode: 'continuous' }] };
        const video = deviceId ? { ...base, deviceId: { exact: deviceId } } : { ...base, facingMode: { ideal: 'environment' } };
        const stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          try { await videoRef.current.play(); } catch (_) {}
        }
        tuneFocus(stream);
        return stream;
      };

      // Lowest camera2 index among back cameras is the main sensor.
      const pickMain = (list) => {
        const idxOf = (lbl) => { const m = (lbl || '').match(/camera2 (\d+)/i); return m ? +m[1] : 999; };
        let best = 0, bestN = Infinity;
        list.forEach((d, i) => { const n = idxOf(d.label); if (n < bestN) { bestN = n; best = i; } });
        return best;
      };

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const s = await open(null); // permission first so labels populate
            if (cancelled) { stopStream(); return; }
            let list = [];
            try {
              const all = await navigator.mediaDevices.enumerateDevices();
              const vids = all.filter(d => d.kind === 'videoinput');
              const backs = vids.filter(d => /back|rear|environment/i.test(d.label));
              list = backs.length ? backs : vids;
            } catch (_) {}
            if (cancelled) { stopStream(); return; }
            if (list.length > 1) {
              // Use the user's remembered lens if still available, else the
              // heuristic main sensor. Lens quality varies per device in ways
              // we can't detect, so the remembered choice wins.
              let saved = null;
              try { saved = localStorage.getItem('macro_camera_device'); } catch (_) {}
              let target = saved ? list.findIndex(d => d.deviceId === saved) : -1;
              if (target < 0) target = pickMain(list);
              setCams(list); setCamIdx(target);
              let curId = null;
              try { curId = s.getVideoTracks()[0].getSettings().deviceId; } catch (_) {}
              if (list[target].deviceId && list[target].deviceId !== curId) {
                try { await open(list[target].deviceId); }
                catch (_) { try { await open(null); } catch (_) {} }
              }
            } else {
              setCams(list);
            }
            if (!cancelled) setReady(true);
          } catch (e) {
            if (!cancelled) { setErr(cameraErrMsg(e)); logError('camera_open', e, null); }
          }
        })();
        return () => { cancelled = true; stopStream(); };
      }, []);

      const switchCam = async () => {
        if (cams.length < 2 || busy) return;
        const next = (camIdx + 1) % cams.length;
        setCamIdx(next); setReady(false);
        try {
          await open(cams[next].deviceId);
          try { localStorage.setItem('macro_camera_device', cams[next].deviceId); } catch (_) {}
          setReady(true);
        } catch (e) { setErr(cameraErrMsg(e)); }
      };

      const tapFocus = async (e) => {
        if (!canTapFocus || !streamRef.current || !videoRef.current) return;
        const track = streamRef.current.getVideoTracks()[0];
        const rect = videoRef.current.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        setReticle({ x: cx, y: cy, ts: Date.now() });
        setTimeout(() => setReticle(r => (r && Date.now() - r.ts >= 950) ? null : r), 1000);
        try {
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          const advanced = [];
          if (caps.pointsOfInterest) advanced.push({ pointsOfInterest: [{ x: cx / rect.width, y: cy / rect.height }] });
          if (caps.focusMode && caps.focusMode.includes('single-shot')) advanced.push({ focusMode: 'single-shot' });
          if (advanced.length) await track.applyConstraints({ advanced });
        } catch (_) {}
      };

      const capture = async () => {
        if (!videoRef.current || !ready || busy) return;
        setBusy(true);
        try {
          const v = videoRef.current;
          const w = v.videoWidth, h = v.videoHeight;
          if (!w || !h) throw new Error('camera not ready yet');
          const maxDim = 1600;
          let dw = w, dh = h;
          if (w > maxDim || h > maxDim) {
            if (w > h) { dh = Math.round(h * maxDim / w); dw = maxDim; }
            else { dw = Math.round(w * maxDim / h); dh = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = dw; canvas.height = dh;
          canvas.getContext('2d').drawImage(v, 0, 0, dw, dh);
          const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
          canvas.width = 0; canvas.height = 0;
          stopStream();
          onCapture(new File([blob], `capture-${Date.now()}.jpg`, { type: 'image/jpeg' }));
        } catch (e) { setErr(cameraErrMsg(e)); setBusy(false); }
      };

      return (
        <div style={{ position: 'fixed', inset: 0, background: '#000', zIndex: 9999, display: 'flex', flexDirection: 'column' }}>
          {err ? (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#fff', padding: 24, textAlign: 'center', gap: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 600 }}>Camera unavailable</div>
              <div style={{ fontSize: 13, opacity: 0.85, lineHeight: 1.5 }}>{err}</div>
              <button onClick={onCancel} style={{ marginTop: 8, padding: '12px 24px', borderRadius: 10, background: '#fff', color: '#000', border: 'none', fontSize: 15, fontWeight: 500 }}>Close</button>
            </div>
          ) : (
            <>
              <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }} onClick={tapFocus}>
                <video ref={videoRef} playsInline muted autoPlay style={{ width: '100%', height: '100%', objectFit: 'contain', background: '#000' }}/>
                {!ready && (
                  <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 14 }}>Starting camera...</div>
                )}
                {busy && (
                  <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.35)', color: '#fff', fontSize: 14 }}>Capturing...</div>
                )}
                {reticle && (
                  <div style={{ position: 'absolute', left: reticle.x - 30, top: reticle.y - 30, width: 60, height: 60, border: '2px solid #fff', borderRadius: 4, pointerEvents: 'none', animation: 'macroFocusPulse 0.9s ease-out forwards' }}/>
                )}
                {ready && (
                  <div style={{ position: 'absolute', bottom: 12, left: 0, right: 0, textAlign: 'center', color: '#fff', opacity: 0.6, fontSize: 11, pointerEvents: 'none' }}>
                    Hold about 15cm away{canTapFocus ? ' · tap to focus' : ''}
                  </div>
                )}
              </div>
              <div style={{ padding: '20px 24px 32px', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <button onClick={() => { stopStream(); onCancel(); }} style={{ background: 'transparent', color: '#fff', border: 'none', fontSize: 15, padding: '12px 4px', minWidth: 64, textAlign: 'left' }}>Cancel</button>
                <button onClick={capture} disabled={!ready || busy} style={{ width: 72, height: 72, borderRadius: 36, background: '#fff', border: '4px solid rgba(255,255,255,0.4)', cursor: 'pointer', opacity: ready && !busy ? 1 : 0.4 }}/>
                <div style={{ minWidth: 64, textAlign: 'right' }}>
                  {cams.length > 1 && (
                    <button onClick={switchCam} disabled={busy} style={{ background: 'rgba(255,255,255,0.15)', color: '#fff', border: 'none', borderRadius: 18, padding: '8px 12px', fontSize: 12 }}>
                      Lens {camIdx + 1}/{cams.length}
                    </button>
                  )}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function PhotoTab({ onSave, apiKey, onSetApiKey, initialFile, fixedMode }) {
      const [mode, setMode] = useState(fixedMode || 'food');
      const [preview, setPreview] = useState(null);
      const [visionData, setVisionData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState(null);
      // Food-mode state
      const [result, setResult] = useState(null);
      const [refineOpen, setRefineOpen] = useState(false);
      const [refineText, setRefineText] = useState('');
      const [corrections, setCorrections] = useState([]); // cumulative user corrections
      // Label-mode state
      const [label, setLabel] = useState(null);
      const [grams, setGrams] = useState('');
      const [name, setName] = useState('');

      const fileRef = useRef();
      const [cameraOpen, setCameraOpen] = useState(false);

      const reset = () => {
        setPreview(null); setVisionData(null); setErr(null);
        setResult(null); setRefineOpen(false); setRefineText(''); setCorrections([]);
        setLabel(null); setGrams(''); setName('');
      };

      const handle = async (f, forcedMode) => {
        if (!f) return;
        const useMode = forcedMode || mode;
        const sizeMB = (f.size / 1048576).toFixed(1);
        // Preserve the source set at button-tap, add file info.
        let prevBeacon = null;
        try { prevBeacon = JSON.parse(localStorage.getItem(PHOTO_BEACON_KEY) || 'null'); } catch (_) {}
        beaconPhotoStart({
          ...(prevBeacon?.extra || {}),
          sizeMB, type: f.type, name: f.name, stage: 'file-received'
        });
        const previewUrl = URL.createObjectURL(f);
        setPreview(previewUrl);
        setErr(null); setResult(null); setLabel(null);
        setRefineOpen(false); setRefineText(''); setCorrections([]);
        setLoading(true);
        try {
          const vd = await compressForVision(f);
          setVisionData(vd);
          setPreview(vd);
          URL.revokeObjectURL(previewUrl);

          if (useMode === 'label') {
            const r = await analyseLabelImage(vd, apiKey);
            setLabel(r);
            setName(r.product_name || '');
            if (r.serving_size_g) setGrams(String(r.serving_size_g));
          } else {
            const r = await analyseFoodImage(vd, apiKey);
            setResult({
              name: r.name || 'Food',
              portion: r.portion_estimate || '',
              calories: num(r.calories), protein: num(r.protein_g),
              carbs: num(r.carbs_g), fat: num(r.fat_g),
              confidence: r.confidence || 'medium', notes: r.notes || '',
              questions: Array.isArray(r.questions) ? r.questions.filter(q => q) : []
            });
          }
          beaconPhotoEnd();
        } catch (e) {
          URL.revokeObjectURL(previewUrl);
          beaconPhotoEnd();
          const stage = useMode === 'label' ? 'label_capture' : 'photo_capture';
          logError(stage, e, { sizeMB, fileType: f.type || 'unknown' });
          if (classifyError(e).kind === 'no_key') setErr('NO_KEY');
          else setErr(`${errLine(e)} [${sizeMB}MB, ${f.type || 'unknown type'}]`);
        } finally { setLoading(false); }
      };

      // Photo recovery: process a pre-picked file once, in this tab's mode.
      const didInit = useRef(false);
      useEffect(() => {
        if (initialFile && !didInit.current) {
          didInit.current = true;
          handle(initialFile, fixedMode || 'food');
        }
      }, [initialFile]);

      // Re-run the food analysis with the full list of accumulated corrections,
      // so earlier corrections are never lost when a new one is added.
      const runFoodAnalysis = async (corrList) => {
        if (!visionData) return;
        setErr(null); setLoading(true);
        try {
          const ctx = corrList.length ? corrList.map((c, i) => `${i + 1}. ${c}`).join('\n') : undefined;
          const r = await analyseFoodImage(visionData, apiKey, ctx);
          setResult({
            name: r.name || 'Food',
            portion: r.portion_estimate || '',
            calories: num(r.calories), protein: num(r.protein_g),
            carbs: num(r.carbs_g), fat: num(r.fat_g),
            confidence: r.confidence || 'medium', notes: r.notes || '',
            questions: Array.isArray(r.questions) ? r.questions.filter(q => q) : []
          });
          setCorrections(corrList);
        } catch (e) {
          logError('photo_refine', e, null);
          setErr(classifyError(e).kind === 'no_key' ? 'NO_KEY' : `Could not refine. ${errLine(e)}`);
        } finally { setLoading(false); }
      };

      const refine = async () => {
        if (!visionData || !refineText.trim()) return;
        const next = [...corrections, refineText.trim()];
        setRefineText('');
        setRefineOpen(false);
        await runFoodAnalysis(next);
      };

      const removeCorrection = async (i) => {
        const next = corrections.filter((_, j) => j !== i);
        await runFoodAnalysis(next);
      };

      const computed = useMemo(() => {
        if (!label) return null;
        const g = num(grams);
        if (!g) return null;
        const ps = label.per_serving;
        const per100 = label.per_100g;
        // Prefer the printed per-serving values as the rate: they are exactly
        // what's on the pack, so eating one serving matches the label with no
        // rounding drift. Fall back to per-100g only if per-serving is missing.
        if (ps && ps.calories != null && label.serving_size_g) {
          const f = g / label.serving_size_g;
          return {
            calories: Math.round(ps.calories * f),
            protein: Math.round((ps.protein_g || 0) * f),
            carbs: Math.round((ps.carbs_g || 0) * f),
            fat: Math.round((ps.fat_g || 0) * f),
            basis: `serving (${label.serving_size_g}g)`
          };
        }
        if (per100 && per100.calories != null) {
          const f = g / 100;
          return {
            calories: Math.round(per100.calories * f),
            protein: Math.round((per100.protein_g || 0) * f),
            carbs: Math.round((per100.carbs_g || 0) * f),
            fat: Math.round((per100.fat_g || 0) * f),
            basis: 'per 100g'
          };
        }
        return null;
      }, [label, grams]);

      const saveLabel = () => {
        if (!computed) return;
        onSave({
          name: name || 'Packaged food',
          portion: `${grams}g`,
          calories: computed.calories, protein: computed.protein,
          carbs: computed.carbs, fat: computed.fat,
          labelData: label ? {
            product_name: label.product_name || null,
            per_100g: label.per_100g || null,
            per_serving: label.per_serving || null,
            serving_size_g: label.serving_size_g || null,
            serving_size_text: label.serving_size_text || null,
          } : null,
          source: 'label'
        });
      };

      if (!apiKey) return <ApiKeyPrompt onSet={onSetApiKey}/>;

      const launch = (which) => {
        if (which === 'camera') { setCameraOpen(true); return; }
        beaconPhotoStart({ source: `${mode}-file` });
        fileRef.current?.click();
      };

      return (
        <div>
          {cameraOpen && (
            <InAppCamera
              onCapture={(f) => { setCameraOpen(false); handle(f, mode); }}
              onCancel={() => setCameraOpen(false)}
            />
          )}
          <input ref={fileRef} type="file" accept="image/*"
            onChange={(e) => handle(e.target.files?.[0])} style={{ display: 'none' }}/>

          {!preview ? (
            <div>
              {!fixedMode && (
                <>
                  <div style={{ fontSize: 13, color: C.inkMuted, marginBottom: 8, fontWeight: 500 }}>
                    What are you photographing?
                  </div>
                  <div style={{ display: 'flex', background: C.surface, padding: 4, borderRadius: 10, border: `1px solid ${C.line}`, marginBottom: 8 }}>
                    {[{v:'food',l:'The food'},{v:'label',l:'A label'}].map(o => (
                      <button key={o.v} onClick={() => setMode(o.v)} style={{
                        flex: 1, border: 'none', padding: '10px 8px', borderRadius: 7,
                        background: mode === o.v ? C.ink : 'transparent',
                        color: mode === o.v ? C.bg : C.inkMuted,
                        fontWeight: mode === o.v ? 500 : 400, fontSize: 14,
                        fontFamily: fonts.body, cursor: 'pointer'
                      }}>{o.l}</button>
                    ))}
                  </div>
                </>
              )}
              <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 18, lineHeight: 1.5 }}>
                {mode === 'label'
                  ? 'Photograph the nutrition panel. Claude reads it and you enter how many grams you ate.'
                  : 'Photograph the meal itself. Claude estimates portion size and macros.'}
              </div>

              <button onClick={() => launch('camera')} style={cameraBtn}>
                <IconCamera size={22} sw={2}/>
                <span>Take photo</span>
              </button>
              <button onClick={() => launch('file')} style={libraryBtn}>
                <IconImage size={15}/>
                <span>Choose from file</span>
              </button>
            </div>
          ) : (
            <div>
              <ZoomablePreview src={preview} maxHeight={(result || label) ? (mode === 'label' ? 150 : 140) : (mode === 'label' ? 300 : 240)}/>
              {loading && (
                <div style={loadingBox}><IconLoader size={18}/><span>
                  {mode === 'label' ? 'Reading the label...' : (refineOpen ? 'Refining estimate...' : 'Analysing your food...')}
                </span></div>
              )}
              {err === 'NO_KEY' ? (
                <ApiKeyPrompt onSet={onSetApiKey}/>
              ) : err && (
                <div style={errBox}><IconAlert size={16}/><span>{err}</span></div>
              )}

              {/* LABEL RESULT */}
              {mode === 'label' && label && !loading && (
                <div>
                  <Field label="Product name">
                    <TextInput value={name} onChange={setName} placeholder="e.g. Greek yoghurt"/>
                  </Field>
                  <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: 14, marginBottom: 16, fontSize: 13, color: C.inkMuted }}>
                    <div style={{ marginBottom: 6, fontWeight: 500, color: C.ink }}>Extracted from label</div>
                    {label.serving_size_text && <div>Serving: <span className="num">{label.serving_size_text}</span></div>}
                    {label.per_serving?.calories != null && (
                      <div className="num">Per serving: {label.per_serving.calories} kcal · P {label.per_serving.protein_g ?? '?'}g · C {label.per_serving.carbs_g ?? '?'}g · F {label.per_serving.fat_g ?? '?'}g</div>
                    )}
                    {label.per_100g?.calories != null && (
                      <div className="num" style={{ color: C.inkSoft }}>Per 100g: {label.per_100g.calories} kcal · P {label.per_100g.protein_g ?? '?'}g · C {label.per_100g.carbs_g ?? '?'}g · F {label.per_100g.fat_g ?? '?'}g</div>
                    )}
                  </div>
                  <Field label="How many grams did you eat?">
                    <NumberInput value={grams} onChange={setGrams} suffix="g"/>
                  </Field>
                  {computed && (
                    <div style={{ background: C.accentSoft, borderRadius: 10, padding: 16, marginBottom: 16 }}>
                      <div style={{ fontSize: 12, color: C.accent, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600, marginBottom: 8 }}>
                        Your portion ({computed.basis})
                      </div>
                      <div className="num display" style={{ fontSize: 34, fontWeight: 500 }}>
                        {computed.calories} <span style={{ fontSize: 14, color: C.inkMuted }}>kcal</span>
                      </div>
                      <div className="num" style={{ fontSize: 14, color: C.inkMuted, marginTop: 6 }}>
                        P {computed.protein}g · C {computed.carbs}g · F {computed.fat}g
                      </div>
                    </div>
                  )}
                  {computed && <button onClick={saveLabel} style={primaryBtn}>Add to today</button>}
                  <button onClick={reset} style={{ ...secondaryBtn, marginTop: 10 }}>Use a different photo</button>
                </div>
              )}

              {/* FOOD RESULT */}
              {mode === 'food' && result && !loading && (
                <div>
                  <EditableResult result={result} setResult={setResult}
                    meta={result.confidence && (
                      <div style={{ fontSize: 12, color: C.inkMuted, marginBottom: 12 }}>
                        AI confidence: <b style={{color: C.ink, textTransform: 'capitalize'}}>{result.confidence}</b>
                        {result.notes && <div style={{marginTop: 4, color: C.inkSoft, fontStyle: 'italic'}}>{result.notes}</div>}
                      </div>
                    )}
                    onSave={() => onSave({...result, source: 'photo'})}
                    showPortion/>

                  {corrections.length > 0 && (
                    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 12, padding: 12, marginTop: 10 }}>

    // ====================== WEIGHT CHART (custom SVG) ======================
    // Convert array of {x, y} points into a smooth Catmull-Rom-as-Bezier SVG path
    function smoothPath(points) {
      if (points.length === 0) return '';
      if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
      const tension = 0.5; // 0 = straight lines, ~0.5 = nicely smooth without overshoot
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const cp1x = p1.x + (p2.x - p0.x) / 6 * tension;
        const cp1y = p1.y + (p2.y - p0.y) / 6 * tension;
        const cp2x = p2.x - (p3.x - p1.x) / 6 * tension;
        const cp2y = p2.y - (p3.y - p1.y) / 6 * tension;
        d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
      }
      return d;
    }

    // Vertical date gridlines between the two end labels, so a long range has
    // something to reference against. Interval scales with the span: weekly up
    // close, then fortnightly, then month boundaries thinned to about five.
    function dateTicks(firstTs, lastTs) {
      const days = (lastTs - firstTs) / 86400000;
      const out = [];
      if (days <= 10) return out;
      if (days <= 24) {
        for (let i = 7; i < days - 2; i += 7) out.push(firstTs + i * 86400000);
      } else if (days <= 70) {
        for (let i = 14; i < days - 4; i += 14) out.push(firstTs + i * 86400000);
      } else {
        const d = new Date(firstTs);
        d.setHours(0, 0, 0, 0); d.setDate(1); d.setMonth(d.getMonth() + 1);
        const months = [];
        while (d.getTime() < lastTs - 5 * 86400000) { months.push(d.getTime()); d.setMonth(d.getMonth() + 1); }
        const step = Math.max(1, Math.ceil(months.length / 5));
        for (let i = 0; i < months.length; i += step) out.push(months[i]);
      }
      const opts = days > 70 ? { month: 'short' } : { day: 'numeric', month: 'short' };
      return out.map(ts => ({ ts, label: new Date(ts).toLocaleDateString('en-AU', opts) }));
    }

    // Maps a pointer position to the nearest point in a series. The SVG is
    // stretched to the container (preserveAspectRatio="none"), so work in
    // fractions of the rendered width rather than in SVG units.
    function nearestPoint(evt, svgEl, pts, tsOf, geom) {
      if (!svgEl || !pts.length) return null;
      const rect = svgEl.getBoundingClientRect();
      if (!rect.width) return null;
      const svgX = ((evt.clientX - rect.left) / rect.width) * geom.w;
      const wanted = geom.firstTs + ((svgX - geom.padL) / geom.iw) * geom.spanMs;
      let best = null, bestDist = Infinity;
      for (const p of pts) {
        const dist = Math.abs(tsOf(p) - wanted);
        if (dist < bestDist) { bestDist = dist; best = p; }
      }
      return best;
    }

    // Readout strip above a chart. Shows the selected point, or a hint when
    // nothing is picked yet, so the chart advertises that it is tappable.
    function ChartReadout({ selected, onClear }) {

          )}
