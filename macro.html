<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4EFE6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Macro" />
  <title>Macro</title>

  <!-- Icon: real PNG files (required for Android standalone install) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- PWA manifest as a real file (data-URI manifests can't install a standalone app) -->
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #F4EFE6;
      --surface: #FBF8F2;
      --ink: #1B1815;
      --ink-muted: #6C655C;
      --ink-soft: #9B948A;
      --line: #E5DDD0;
      --accent: #C85A30;
      --accent-soft: #F3D9CC;
      --green: #587049;
      --red: #A8412C;
      --display: "Fraunces", "Times New Roman", serif;
      --body: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    body {
      font-family: var(--body);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-family: var(--display); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .display { font-family: var(--display); letter-spacing: -0.02em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes macroFocusPulse {
      0%   { transform: scale(1.4); opacity: 0; }
      30%  { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .animate-spin { animation: spin 1s linear infinite; }
    .view { animation: fadein 0.25s ease-out; }
    /* iOS PWA safe areas */
    .safe-top { padding-top: env(safe-area-inset-top, 0); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
    /* Number input chrome strip */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    // ====================== THEME ======================
    const C = {
      bg: '#F4EFE6', surface: '#FBF8F2',
      ink: '#1B1815', inkMuted: '#6C655C', inkSoft: '#9B948A',
      line: '#E5DDD0',
      accent: '#C85A30', accentSoft: '#F3D9CC',
      green: '#587049', red: '#A8412C',
    };
    const fonts = {
      display: '"Fraunces", "Times New Roman", serif',
      body: '"IBM Plex Sans", system-ui, sans-serif',
      num: '"Fraunces", "Times New Roman", serif',
    };

    // ====================== HELPERS ======================
    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const formatDay = (dateStr) =>
      new Date(dateStr + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
    const formatDayShort = (dateStr) =>
      new Date(dateStr + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
    const uid = () => Math.random().toString(36).slice(2, 10);
    const num = (v, fallback = 0) => {
      const n = Number(v);
      return isNaN(n) ? fallback : n;
    };

    // Hamilton (largest remainder) rounding so percentages sum to exactly 100
    const hamilton100 = (values) => {
      const total = values.reduce((a, b) => a + b, 0);
      if (total <= 0) return values.map(() => 0);
      const raw = values.map(v => v / total * 100);
      const floored = raw.map(v => Math.floor(v));
      let remaining = 100 - floored.reduce((a, b) => a + b, 0);
      const order = raw
        .map((v, i) => ({ i, frac: v - Math.floor(v) }))
        .sort((a, b) => b.frac - a.frac);
      const out = [...floored];
      for (let k = 0; k < remaining; k++) out[order[k % order.length].i]++;
      return out;
    };

    // Split a "portion" string into displayable lines.
    // Strips leading bullet/hyphen markers the AI might leak in.
    const portionLines = (s) => {
      if (!s) return [];
      return String(s)
        .split('\n')
        .map(l => l.replace(/^[\s\-•·*]+/, '').trim())
        .filter(Boolean);
    };

    // localStorage wrapper
    const S = {
      get: (key) => {
        try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
        catch { return null; }
      },
      set: (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch (e) { console.error('localStorage set failed', e); }
      },
      del: (key) => localStorage.removeItem(key),
      keys: (prefix = '') => Object.keys(localStorage).filter(k => k.startsWith(prefix)),
      all: () => {
        const out = {};
        for (const k of Object.keys(localStorage)) {
          try { out[k] = JSON.parse(localStorage.getItem(k)); }
          catch { out[k] = localStorage.getItem(k); }
        }
        return out;
      },
      wipe: () => localStorage.clear(),
    };

    // ====================== CALCULATOR ======================
    const ACTIVITY = {
      sedentary: { mult: 1.2, label: 'Sedentary (desk job, little exercise)' },
      light: { mult: 1.375, label: 'Light (1-3 sessions/week)' },
      moderate: { mult: 1.55, label: 'Moderate (3-5 sessions/week)' },
      active: { mult: 1.725, label: 'Active (6-7 sessions/week)' },
      very_active: { mult: 1.9, label: 'Very active (2x daily training)' },
    };
    const GOAL = {
      cut: { adj: -500, label: 'Lose weight' },
      maintain: { adj: 0, label: 'Maintain' },
      lean_bulk: { adj: 300, label: 'Lean gain' },
      bulk: { adj: 500, label: 'Bulk' },
    };
    const calcBMR = ({ sex, weight_kg, height_cm, age_years }) => {
      const base = 10 * weight_kg + 6.25 * height_cm - 5 * age_years;
      return sex === 'male' ? base + 5 : base - 161;
    };
    const calcTargets = (p) => {
      if (!p) return null;
      const bmr = calcBMR(p);
      const tdee = bmr * ACTIVITY[p.activity].mult;
      const calories = Math.round(tdee + GOAL[p.goal].adj);
      const protein = Math.round(p.weight_kg * 1.6);
      const fat = Math.round(calories * 0.3 / 9);
      const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
      return { calories, protein, carbs, fat, tdee: Math.round(tdee), bmr: Math.round(bmr) };
    };

    // ====================== VISION ======================
    const fileToBase64 = (file) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(taggedError('decode', 'the file could not be read from disk', r.error));
      r.readAsDataURL(file);
    });

    // Tag an Error with a `kind` (read by classifyError) and preserve the
    // underlying cause, so failures can be described precisely.
    function taggedError(kind, message, cause) {
      const e = new Error(message);
      e.kind = kind;
      if (cause) e.cause = cause;
      return e;
    }

    // Lazily load the HEIC converter (only when a decode actually fails).
    // Samsung "high efficiency" photos are HEIC, which Chrome on Android
    // can't decode in a canvas; this converts them to JPEG.
    let _heicLoader = null;
    const loadHeic2any = () => {
      if (window.heic2any) return Promise.resolve(window.heic2any);
      if (_heicLoader) return _heicLoader;
      _heicLoader = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
        s.onload = () => window.heic2any ? res(window.heic2any) : rej(new Error('HEIC converter unavailable'));
        s.onerror = () => rej(new Error('Could not load HEIC converter (no connection?)'));
        document.head.appendChild(s);
      });
      return _heicLoader;
    };
    const convertHeicToJpeg = async (file) => {
      let heic2any;
      try { heic2any = await loadHeic2any(); }
      catch (e) { throw taggedError('network', 'the HEIC image converter could not load', e); }
      try {
        const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
        return Array.isArray(out) ? out[0] : out;
      } catch (e) {
        throw taggedError('convert_failed', 'not a readable HEIC image, or conversion failed', e);
      }
    };

    // Try to decode + downscale a blob, using createImageBitmap (low memory)
    // then falling back to an <img> element. Throws a real Error on failure,
    // carrying the underlying reason.
    const tryDecode = async (src, maxDim) => {
      let bitmapErr = null;
      if (typeof createImageBitmap === 'function') {
        try {
          // Pass only one resize dim so aspect ratio is preserved.
          let bitmap = await createImageBitmap(src, { resizeWidth: maxDim, resizeQuality: 'high' });
          if (bitmap.height > maxDim) {
            const old = bitmap;
            bitmap = await createImageBitmap(src, { resizeHeight: maxDim, resizeQuality: 'high' });
            old.close();
          }
          return { source: bitmap, w: bitmap.width, h: bitmap.height, cleanup: () => bitmap.close() };
        } catch (e) {
          bitmapErr = e;
          // fall through to <img>
        }
      }
      const url = URL.createObjectURL(src);
      try {
        const img = await new Promise((res, rej) => {
          const el = new Image();
          el.onload = () => res(el);
          el.onerror = () => rej(new Error('the browser could not render this image'));
          el.src = url;
        });
        let { naturalWidth: w, naturalHeight: h } = img;
        if (!w || !h) throw new Error('image reported zero dimensions');
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h / w) * maxDim); w = maxDim; }
          else { w = Math.round((w / h) * maxDim); h = maxDim; }
        }
        return { source: img, w, h, cleanup: () => URL.revokeObjectURL(url) };
      } catch (imgErr) {
        URL.revokeObjectURL(url);
        const reason = (imgErr && imgErr.message) || (bitmapErr && bitmapErr.message) || 'unknown decode failure';
        throw new Error(reason);
      }
    };

    // Decode an image file at a target max dimension. On decode failure,
    // assume it may be HEIC, convert to JPEG, and retry. If that also fails,
    // throw a clear error naming the file type.
    const decodeAtMaxDim = async (file, maxDim) => {
      const t = file.type || 'unknown type';
      let directErr = null;
      try {
        return await tryDecode(file, maxDim);
      } catch (e) {
        directErr = e;
      }
      // Direct decode failed. Most likely HEIC; convert to JPEG and retry.
      try {
        const jpeg = await convertHeicToJpeg(file);
        return await tryDecode(jpeg, maxDim);
      } catch (convErr) {
        if (convErr.kind === 'network') {
          // The converter couldn't load (offline). Surface that honestly.
          throw taggedError('network',
            `couldn't decode ${t} (${directErr.message}) and the HEIC converter couldn't load`,
            convErr);
        }
        // convert_failed = it wasn't HEIC, or conversion broke. Either way the
        // browser cannot read this file. Report the format and the real reason.
        throw taggedError('decode', `${t}: ${directErr.message}`, convErr);
      }
    };

    // Encode a decoded source to a JPEG data URL via canvas
    const encodeToDataURL = (source, w, h, quality) => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(source, 0, 0, w, h);
        const data = canvas.toDataURL('image/jpeg', quality);
        canvas.width = 0;
        canvas.height = 0;
        if (!data || data.length < 30) throw new Error('canvas produced an empty image');
        return data;
      } catch (e) {
        if (e.kind) throw e;
        throw taggedError('decode', `could not redraw the image (${e.message || 'canvas error'})`, e);
      }
    };

    // Public API kept the same to avoid touching call sites.
    const compressImageToDataURL = async (file, maxDim = 400, quality = 0.72) => {
      const { source, w, h, cleanup } = await decodeAtMaxDim(file, maxDim);
      try {
        return encodeToDataURL(source, w, h, quality);
      } finally {
        cleanup();
      }
    };

    // Compress at vision-suitable resolution (~1280px) for the API call.
    const compressForVision = (file) => compressImageToDataURL(file, 1280, 0.82);

    // Extract base64 + media type from either a File or a data: URL string
    const imageToParts = async (fileOrDataUrl) => {
      if (typeof fileOrDataUrl === 'string') {
        const m = fileOrDataUrl.match(/^data:([^;]+);base64,(.+)$/);
        if (!m) throw taggedError('decode', 'the prepared image data was malformed');
        return { mediaType: m[1] || 'image/jpeg', data: m[2] };
      }
      return {
        mediaType: fileOrDataUrl.type || 'image/jpeg',
        data: await fileToBase64(fileOrDataUrl),
      };
    };


    // ---------- Google Drive sync (optional) ----------
    // Ported from the Receipts app, which uses the same pattern. Macro's data
    // is one localStorage object, so a single JSON file is the whole backup;
    // there are no images to reconcile.
    //
    // The Google sign-in script is fetched from accounts.google.com on demand.
    // That is an external dependency, but an unavoidable one: Google will not
    // issue a token any other way. It loads only when you tap Sync or Restore,
    // so it never sits in the boot path.
    const DRIVE_FOLDER = 'Macro App';
    const DRIVE_FILE = 'macro.json';
    const gis = { token: null, exp: 0, client: null };

    const loadGIS = () => new Promise((res, rej) => {
      if (window.google && google.accounts) return res();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => res();
      s.onerror = () => rej(new Error('Could not load the Google sign-in script. Check your connection.'));
      document.head.appendChild(s);
    });

    const driveToken = async (clientId) => {
      if (gis.token && Date.now() < gis.exp - 60000) return gis.token;
      try {
        const c = JSON.parse(sessionStorage.getItem('macro_gtoken') || 'null');
        if (c && Date.now() < c.exp - 60000) { gis.token = c.token; gis.exp = c.exp; return c.token; }
      } catch (_) {}
      await loadGIS();
      return new Promise((res, rej) => {
        gis.client = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          // drive.file: the app can only see files it created itself.
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (r) => {
            if (r.error) return rej(new Error(r.error_description || r.error));
            gis.token = r.access_token;
            gis.exp = Date.now() + (r.expires_in || 3600) * 1000;
            try { sessionStorage.setItem('macro_gtoken', JSON.stringify({ token: gis.token, exp: gis.exp })); } catch (_) {}
            res(gis.token);
          },
          error_callback: (e) => rej(new Error(e && e.message ? e.message : 'Google sign-in was cancelled'))
        });
        gis.client.requestAccessToken({ prompt: '' });
      });
    };

    const dfetch = async (token, url, opts = {}) => {
      const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
      if (!r.ok) {
        let m = '';
        try { m = (await r.json()).error.message; } catch (_) {}
        throw new Error(m || `Drive HTTP ${r.status}`);
      }
      return r;
    };

    const driveFolder = async (token) => {
      const q = encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
      const j = await (await dfetch(token, `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`)).json();
      if (j.files && j.files.length) return j.files[0].id;
      const c = await (await dfetch(token, 'https://www.googleapis.com/drive/v3/files', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: DRIVE_FOLDER, mimeType: 'application/vnd.google-apps.folder' })
      })).json();
      return c.id;
    };

    const driveFindFile = async (token, folderId) => {
      const q = encodeURIComponent(`'${folderId}' in parents and name='${DRIVE_FILE}' and trashed=false`);
      const j = await (await dfetch(token, `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`)).json();
      return (j.files && j.files[0]) || null;
    };

    const driveUpload = async (token, folderId, blob, existingId) => {
      const meta = existingId ? {} : { name: DRIVE_FILE, parents: [folderId] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      form.append('file', blob);
      const url = existingId
        ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
        : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      const j = await (await dfetch(token, url, { method: existingId ? 'PATCH' : 'POST', body: form })).json();
      return j.id;
    };

    const driveDownloadJson = async (token, id) =>
      (await dfetch(token, `https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();

    // The payload is the same shape the Export JSON button produces, so a Drive
    // file and an exported file are interchangeable.
    const backupPayload = () => {
      const data = S.all();
      delete data.api_key;   // never leaves the device
      delete data.drive_client_id;
      return data;
    };
    const applyBackup = (data) => {
      let keys = 0;
      for (const [k, v] of Object.entries(data)) {
        if (k === 'api_key' || k === 'drive_client_id') continue;
        S.set(k, v); keys++;
      }
      return keys;
    };

    const ANTHROPIC_URL = "https://api.anthropic.com/v1/messages";

    // Single point for Anthropic requests. Throws errors tagged with a `kind`
    // so failures can be told apart: network vs HTTP status vs bad response.
    const anthropicCall = async (messages, apiKey, maxTokens) => {
      if (!apiKey) { const e = new Error('NO_API_KEY'); e.kind = 'no_key'; throw e; }
      let resp;
      try {
        resp = await fetch(ANTHROPIC_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          // Opus 5 thinks by default, and max_tokens caps thinking + reply together,
          // so the callers' token budgets are sized for both. Adaptive thinking is
          // what fixes the macro arithmetic; low effort keeps logging quick. If
          // estimates drift, raise effort before changing anything else.
          body: JSON.stringify({
            model: "claude-opus-5",
            max_tokens: maxTokens,
            output_config: { effort: "low" },
            messages
          })
        });
      } catch (netErr) {
        // fetch only rejects on network-level failure (offline, DNS, CORS block)
        const e = new Error(netErr && netErr.message ? netErr.message : 'network request failed');
        e.kind = 'network';
        throw e;
      }
      if (!resp.ok) {
        let bodyText = '';
        try { bodyText = await resp.text(); } catch (_) {}
        let apiMsg = '';
        try { const j = JSON.parse(bodyText); apiMsg = (j && j.error && j.error.message) || j.message || ''; } catch (_) {}
        const e = new Error(apiMsg || `HTTP ${resp.status}`);
        e.kind = 'http';
        e.status = resp.status;
        e.body = bodyText.slice(0, 300);
        throw e;
      }
      let result;
      try { result = await resp.json(); }
      catch (_) { const e = new Error('service returned a non-JSON response'); e.kind = 'bad_response'; throw e; }
      return (result.content || []).filter(c => c.type === 'text').map(c => c.text).join('').trim();
    };

    // Parse a JSON object out of the model's text reply. Throws kind:'bad_response'
    // with a snippet of what came back if it isn't valid JSON.
    const parseJsonReply = (text) => {
      const cleaned = (text || '').replace(/^```json\s*/i, '').replace(/```$/, '').trim();
      try { return JSON.parse(cleaned); }
      catch (_) {
        const e = new Error('the AI reply was not in the expected format');
        e.kind = 'bad_response';
        e.body = cleaned.slice(0, 300);
        throw e;
      }
    };

    const callVision = async (fileOrDataUrl, prompt, apiKey) => {
      if (!apiKey) { const e = new Error('NO_API_KEY'); e.kind = 'no_key'; throw e; }
      let parts;
      try { parts = await imageToParts(fileOrDataUrl); }
      catch (e) { if (!e.kind) e.kind = 'decode'; throw e; }
      const text = await anthropicCall([{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: parts.mediaType, data: parts.data } },
          { type: "text", text: prompt }
        ]
      }], apiKey, 5000);
      return parseJsonReply(text);
    };

    const callText = async (prompt, apiKey) => {
      const text = await anthropicCall([{ role: "user", content: prompt }], apiKey, 4000);
      return parseJsonReply(text);
    };

    const AU_CONTEXT = `The user is in Australia. Use Australian portion conventions and food knowledge. Common Australian items to recognise when relevant: charcoal chicken (whole rotisserie chicken with skin), halal snack pack (HSP), bain-marie meals from food courts, Coles/Woolies/Aldi packaged staples, snags (sausages), pies, lamingtons, Vegemite, Tim Tams, flat whites, plunger coffee, schnitzel, parma (chicken parmigiana), barramundi, kangaroo. Use typical Australian serving sizes (e.g. a "large" charcoal chicken is a full bird ~1.2-1.4kg cooked weight, a "small" is half a bird).

Australian eggs are sold by graded minimum weight per egg, in shell: small 43g, medium 49g, large 59g, extra large 68g, jumbo 78g. Edible portion is about 89% of the in-shell weight (so an extra large egg is roughly 60g of edible egg, not 50g). When the user names an egg size, use that grade's weight rather than a generic "one egg" figure. Apply the same logic to other graded or size-named produce: a "large" banana is ~136g peeled against a medium at ~118g, and a "large" avocado is ~200g of flesh against a medium at ~150g.`;

                touchAction: 'none', willChange: 'transform'
              }}/>
          </div>
        </div>
      );
    }

    function ZoomablePreview({ src, maxHeight = 240 }) {
      const [open, setOpen] = useState(false);
      if (!src) return null;
      return (
        <>
          <div onClick={() => setOpen(true)} style={{
            position: 'relative', borderRadius: 12, overflow: 'hidden',
            marginBottom: 16, border: `1px solid ${C.line}`, cursor: 'zoom-in'
          }}>
            <img src={src} style={{ width: '100%', display: 'block', maxHeight, objectFit: 'cover' }}/>
            <div style={{
              position: 'absolute', bottom: 8, right: 8,
              background: 'rgba(0,0,0,0.55)', color: 'white',
              borderRadius: 8, padding: '6px 8px',
              display: 'flex', alignItems: 'center', gap: 4,
              fontSize: 11, fontWeight: 500, letterSpacing: '0.04em'
            }}>
              <IconMaximize size={12}/> Zoom
            </div>
          </div>
          {open && <ImageLightbox src={src} onClose={() => setOpen(false)}/>}
        </>
      );
    }

    // ====================== ERROR DIAGNOSTICS ======================
    // Global error capture. On mobile, when the WebView crashes mid-flow
    // (e.g. OOM from a huge camera photo, or Android killing the WebView
    // while the camera intent is foregrounded), the tab silently reloads.
    // We use localStorage (not sessionStorage) because a full process kill
    // can wipe sessionStorage but leaves localStorage intact.
    const BUILD_VERSION = '2026-09-06-drive-sync-pages';
    // Window for the rolling-average line on the intake charts, in days.
    const SMOOTH_DAYS = 14;
    const DIAG_KEY = 'macro_diag_error';
    const LOG_KEY = 'macro_error_log';
    const PHOTO_BEACON_KEY = 'macro_photo_beacon';

    // Turn any thrown value into a structured, plain-language description.
    const classifyError = (e) => {
      const kind = (e && e.kind) || 'unknown';
      const raw = (e && e.message) ? String(e.message) : String(e);
      if (kind === 'no_key' || raw === 'NO_API_KEY')
        return { kind: 'no_key', title: 'API key needed', detail: '', hint: '' };
      if (kind === 'network' || /failed to fetch|networkerror|load failed|network request failed/i.test(raw))
        return { kind: 'network', title: 'Could not reach the AI service', detail: raw, hint: 'Check your internet connection, then try again' };
      if (kind === 'http') {
        const s = e.status;
        if (s === 401 || s === 403) return { kind: 'auth', title: 'API key was rejected', detail: `HTTP ${s}. ${raw}`, hint: 'Check the key in Settings is correct and still active' };
        if (s === 429) return { kind: 'rate', title: 'Rate limit reached', detail: `HTTP 429. ${raw}`, hint: 'Wait a minute, then try again' };
        if (s === 413) return { kind: 'too_large', title: 'Image was too large for the service', detail: `HTTP 413. ${raw}`, hint: 'Try a smaller or lower-resolution photo' };
        if (s === 400) return { kind: 'bad_request', title: 'The service rejected the request', detail: `HTTP 400. ${raw}`, hint: 'The image format may be unsupported' };
        if (s >= 500) return { kind: 'server', title: 'The AI service had an error', detail: `HTTP ${s}. ${raw}`, hint: 'This is on their side. Try again shortly' };
        return { kind: 'http', title: `Request failed (HTTP ${s})`, detail: raw, hint: '' };
      }
      if (kind === 'bad_response')
        return { kind: 'bad_response', title: 'Unexpected reply from the AI', detail: raw, hint: 'Try again; if it keeps happening, tell me' };
      if (kind === 'convert_failed' || kind === 'decode' || /decode|couldn't decode|could not (read|render|redraw)|zero dimensions|malformed|unsupported|empty image/i.test(raw)) {
        const isHeic = /heic|heif/i.test(raw);
        return {
          kind: 'decode',
          title: 'Could not read the image file',
          detail: raw,
          hint: isHeic
            ? 'This is a HEIC photo and it could not be converted. Set your camera to "JPEG" / "most compatible", or pick a JPEG'
            : 'The format may be unsupported or the file may be damaged. Try a different photo, or set your camera to JPEG'
        };
      }
      return { kind: 'unknown', title: 'Something went wrong', detail: raw, hint: '' };
    };

    // One-line version for inline display.
    const errLine = (e) => {
      const c = classifyError(e);
      return [c.title, c.detail, c.hint ? `(${c.hint})` : ''].filter(Boolean).join('. ');
    };

    const collectDiag = () => {
      const d = {
        build: BUILD_VERSION,
        ua: navigator.userAgent,
        platform: navigator.platform || 'unknown',
        deviceMemoryGB: navigator.deviceMemory || 'unknown',
        cores: navigator.hardwareConcurrency || 'unknown',
        online: navigator.onLine,
        ts: new Date().toISOString()
      };
      if (performance.memory) {
        d.jsHeapUsedMB = Math.round(performance.memory.usedJSHeapSize / 1048576);
        d.jsHeapLimitMB = Math.round(performance.memory.jsHeapSizeLimit / 1048576);
      }
      return d;
    };

    // Append a structured record to a rolling log (last 12), readable in Settings.
    const logError = (stage, e, ctx) => {
      try {
        const c = classifyError(e);
        const rec = {
          ts: new Date().toISOString(),
          stage,
          kind: c.kind,
          title: c.title,
          message: (e && e.message) ? String(e.message).slice(0, 300) : String(e).slice(0, 300),
          status: e && e.status != null ? e.status : undefined,
          body: e && e.body ? String(e.body).slice(0, 300) : undefined,
          ctx: ctx || undefined,
          build: BUILD_VERSION,
          online: navigator.onLine,
        };
        let arr = [];
        try { arr = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (_) {}
        arr.unshift(rec);
        localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(0, 12)));
      } catch (_) {}
    };

    const recordError = (stage, msg, extra) => {
      // Last-error for the top banner
      try {
        localStorage.setItem(DIAG_KEY, JSON.stringify({
          kind: stage, msg: String(msg).slice(0, 500),
          extra: extra || null, diag: collectDiag()
        }));
      } catch (_) {}
      // Also append to the rolling log
      const fake = { message: String(msg), kind: 'unknown' };
      if (extra && extra.status != null) { fake.status = extra.status; fake.kind = 'http'; }
      logError(stage, fake, extra);
    };

    const beaconPhotoStart = (extra) => {
      try {
        localStorage.setItem(PHOTO_BEACON_KEY, JSON.stringify({
          ts: new Date().toISOString(),
          build: BUILD_VERSION,
          extra: extra || null
        }));
      } catch (_) {}
    };
    const beaconPhotoEnd = () => {
      try { localStorage.removeItem(PHOTO_BEACON_KEY); } catch (_) {}
    };

    // Install handlers once
    if (typeof window !== 'undefined' && !window.__macroErrInstalled) {
      window.__macroErrInstalled = true;
      window.addEventListener('error', (e) => {
        recordError('error', e.message || e.error?.message || 'unknown error', {
          source: e.filename, line: e.lineno, col: e.colno
        });
      });
      window.addEventListener('unhandledrejection', (e) => {
        recordError('promise', e.reason?.message || String(e.reason) || 'unhandled rejection');
      });
    }

    function ErrorBanner() {
      const [diag, setDiag] = useState(null);
      const [showVersion, setShowVersion] = useState(true);

      useEffect(() => {
        // ErrorBanner only handles uncaught JS errors. The photo-capture
        // beacon is handled solely by App's recovery flow, so we must NOT
        // read or clear PHOTO_BEACON_KEY here or we race the recovery.
        try {
          const raw = localStorage.getItem(DIAG_KEY);
          if (raw) setDiag(JSON.parse(raw));
        } catch (_) {}
        const t = setTimeout(() => setShowVersion(false), 8000);
        return () => clearTimeout(t);
      }, []);

      const dismiss = () => {
        try { localStorage.removeItem(DIAG_KEY); } catch (_) {}
        setDiag(null);
      };

      if (!diag) {
        if (!showVersion) return null;
        return (
          <div style={{
            position: 'fixed', top: 6, right: 8, zIndex: 9999,
            fontSize: 9, color: C.inkSoft, opacity: 0.6,
            fontFamily: 'monospace', pointerEvents: 'none'
          }}>
            build {BUILD_VERSION}
          </div>
        );
      }

      const d = diag?.diag || collectDiag();

      return (
        <div style={{
          background: '#FFE9DC', borderBottom: `2px solid ${C.accent}`,
          padding: '14px 18px', fontSize: 13, color: C.ink, lineHeight: 1.5
        }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>Something went wrong</div>
              <div style={{ color: C.inkSoft }}>{diag.kind}: {diag.msg}</div>
              <details style={{ marginTop: 8 }}>
                <summary style={{ fontSize: 11, color: C.inkSoft, cursor: 'pointer' }}>Diagnostics</summary>
                <pre style={{ fontSize: 10, color: C.inkSoft, marginTop: 6, whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>
{JSON.stringify(d, null, 2)}
                </pre>
              </details>
            </div>
            <button onClick={dismiss} style={{
              background: 'transparent', border: 'none', color: C.inkSoft,
              fontSize: 20, cursor: 'pointer', padding: 0, lineHeight: 1
            }}>×</button>
          </div>
        </div>
      );
    }

    function PhotoRecoveryBanner({ beacon, onPick, onDismiss }) {
      const isLabel = beacon?.extra?.source?.startsWith('label');
      // Detect if running as installed standalone PWA
      const isStandalone = window.matchMedia?.('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      return (
        <div style={{
          position: 'fixed', left: 12, right: 12, bottom: 96,
          background: C.surface, border: `1px solid ${C.accent}`,
          borderRadius: 14, padding: 16,
          boxShadow: '0 8px 24px rgba(0,0,0,0.18)', zIndex: 60,
          maxWidth: 580, margin: '0 auto'
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 4 }}>
              Your {isLabel ? 'label' : 'food'} photo is saved
            </div>
            <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.45 }}>
              The page reloaded during capture, but the photo is in your gallery. Tap below and pick the most recent shot to continue.
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
              <button onClick={onPick} style={{
                background: C.accent, color: C.surface, border: 'none',
                borderRadius: 8, padding: '10px 18px', fontSize: 14, fontWeight: 500,
                fontFamily: fonts.body, cursor: 'pointer'
              }}>Pick the photo</button>
              <button onClick={onDismiss} style={{
                background: 'transparent', color: C.inkSoft, border: 'none',
                borderRadius: 8, padding: '10px 14px', fontSize: 14,
                fontFamily: fonts.body, cursor: 'pointer'
              }}>Dismiss</button>
            </div>
            {!isStandalone && (
              <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}`, lineHeight: 1.45 }}>
                To stop this happening: add Macro to your home screen (Chrome menu, "Add to Home screen") and open it from there. The installed app runs separately from your browser tabs, so the camera won't get killed.
              </div>
            )}
          </div>
        </div>
      );
    }

    // ====================== APP ======================
    function App() {
      const [view, setView] = useState('today');
      const [addOpen, setAddOpen] = useState(false);
      const [addInitialTab, setAddInitialTab] = useState('photo');
      const [addInitialFile, setAddInitialFile] = useState(null);
      const [pendingPhotoRecovery, setPendingPhotoRecovery] = useState(null);
      const recoveryFileRef = useRef(null);
      const recoveryTabRef = useRef('photo');
      const [editEntry, setEditEntry] = useState(null); // { entry, date }

      const [profile, setProfile] = useState(null);
      const [targets, setTargets] = useState(null);
      const [weights, setWeights] = useState([]);
      const [logs, setLogs] = useState({});
      const [favourites, setFavourites] = useState([]);
      const [apiKey, setApiKey] = useState('');

      // Load on mount
      useEffect(() => {
        setProfile(S.get('profile'));
        setTargets(S.get('targets'));
        setWeights(S.get('weights') || []);
        setApiKey(S.get('api_key') || '');
        setFavourites(S.get('favourites') || []);
        const logsObj = {};
        for (const k of S.keys('log:')) {
          logsObj[k.replace('log:', '')] = S.get(k);
        }
        setLogs(logsObj);

        // Photo recovery: if a beacon is set with native-camera source, the
        // WebView may have been killed during the camera intent. The photo
        // is still in the user's gallery. Offer to recover it.
        try {
          const beaconRaw = localStorage.getItem(PHOTO_BEACON_KEY);
          if (beaconRaw) {
            const beacon = JSON.parse(beaconRaw);
            const isNativeCam = beacon?.extra?.source?.includes('native');
            const isRecent = Date.now() - new Date(beacon.ts).getTime() < 10 * 60 * 1000;
            if (isNativeCam && isRecent) {
              setPendingPhotoRecovery(beacon);
            }
            localStorage.removeItem(PHOTO_BEACON_KEY);
          }
        } catch (_) {}
      }, []);

      const saveProfile = (p) => { setProfile(p); S.set('profile', p); };
      const saveTargets = (t) => { setTargets(t); S.set('targets', t); };
      const saveWeights = (w) => { setWeights(w); S.set('weights', w); };
      const saveApiKey = (k) => { setApiKey(k); S.set('api_key', k); };
      const saveFavourites = (f) => { setFavourites(f); S.set('favourites', f); };
      const saveLog = (date, entries) => {
        const next = { ...logs, [date]: entries };
        setLogs(next);
        if (entries.length === 0) {
          const copy = { ...next }; delete copy[date]; setLogs(copy);
          S.del('log:' + date);
        } else {
          S.set('log:' + date, entries);
        }
      };

      const addEntry = (entry) => {
        const date = entry.date || todayStr();
        const cleanEntry = { ...entry };
        delete cleanEntry.date;
        const existing = logs[date] || [];
        saveLog(date, [...existing, { ...cleanEntry, id: uid(), time: Date.now() }]);
      };

      const deleteEntry = (date, id) => {
        const next = (logs[date] || []).filter(e => e.id !== id);
        saveLog(date, next);
      };

      const updateEntry = (originalDate, id, updates, newDate) => {
        const oldEntries = (logs[originalDate] || []).filter(e => e.id !== id);
        const entry = (logs[originalDate] || []).find(e => e.id === id);
        if (!entry) return;
        const updated = { ...entry, ...updates };
        const targetDate = newDate || originalDate;
        if (targetDate === originalDate) {
          const all = (logs[originalDate] || []).map(e => e.id === id ? updated : e);
          saveLog(originalDate, all);
        } else {
          // Move between days
          saveLog(originalDate, oldEntries);
          const dest = logs[targetDate] || [];
          // Need to handle state correctly since saveLog is async-ish
          const newDestEntries = [...dest, updated];
          setLogs(prev => {
            const copy = { ...prev };
            if (oldEntries.length === 0) delete copy[originalDate];
            else copy[originalDate] = oldEntries;
            copy[targetDate] = newDestEntries;
            return copy;
          });
          if (oldEntries.length === 0) S.del('log:' + originalDate);
          else S.set('log:' + originalDate, oldEntries);
          S.set('log:' + targetDate, newDestEntries);
        }
      };

      const toggleFavourite = (entry) => {
        // Match by name (case-insensitive trim)
        const key = (entry.name || '').trim().toLowerCase();
        const idx = favourites.findIndex(f => (f.name || '').trim().toLowerCase() === key);
        if (idx >= 0) {
          saveFavourites(favourites.filter((_, i) => i !== idx));
        } else {
          const fav = {
            id: uid(),
            name: entry.name, portion: entry.portion,
            calories: entry.calories, protein: entry.protein,
            carbs: entry.carbs, fat: entry.fat,
            imageData: entry.imageData,
            labelData: entry.labelData,
            source: entry.source
          };
          saveFavourites([fav, ...favourites]);
        }
      };

      const isFavourite = (entry) => {
        const key = (entry?.name || '').trim().toLowerCase();
        return favourites.some(f => (f.name || '').trim().toLowerCase() === key);
      };

      // Update a favourite by id (template editing), or create a new one if id missing/not found
      const upsertFavourite = (fav) => {
        const clean = {
          id: fav.id || uid(),
          name: fav.name, portion: fav.portion,
          calories: fav.calories, protein: fav.protein,
          carbs: fav.carbs, fat: fav.fat,
          imageData: fav.imageData,
          labelData: fav.labelData,
          source: fav.source
        };
        const idx = favourites.findIndex(f => f.id === clean.id);
        if (idx >= 0) {
          const next = [...favourites];
          next[idx] = clean;
          saveFavourites(next);
        } else {
          saveFavourites([clean, ...favourites]);
        }
        return clean.id;
      };

      const today = todayStr();
      const todayLog = logs[today] || [];

      const totals = useMemo(() =>
        todayLog.reduce((a, e) => ({
          cal: a.cal + num(e.calories),
          p: a.p + num(e.protein),
          c: a.c + num(e.carbs),
          f: a.f + num(e.fat),
        }), { cal: 0, p: 0, c: 0, f: 0 })
      , [todayLog]);

      // First-time onboarding
      if (!profile) {
        return <Onboarding onComplete={(p) => {
          saveProfile(p);
          saveTargets({ ...calcTargets(p), mode: 'calculated' });
        }} />;
      }

      return (
        <div style={{ minHeight: '100vh', color: C.ink, fontFamily: fonts.body, paddingBottom: 110 }} className="safe-top">
          <ErrorBanner/>
          <div className="view" key={view} style={{ maxWidth: 600, margin: '0 auto', padding: '20px 18px 0' }}>
            {view === 'today' && (
              <TodayView profile={profile} targets={targets} totals={totals} log={todayLog}
                onDelete={(id) => deleteEntry(today, id)}
                onEdit={(entry) => setEditEntry({ entry, date: today })}
                isFavourite={isFavourite} onToggleFavourite={toggleFavourite}
              />
            )}
            {view === 'weight' && (
              <WeightView weights={weights} logs={logs} profile={profile} targets={targets}
                onAdd={(w) => {
                  const idx = weights.findIndex(x => x.date === w.date);
                  const next = idx >= 0
                    ? weights.map(x => x.date === w.date ? w : x)
                    : [...weights, w];
                  saveWeights(next.sort((a, b) => a.date.localeCompare(b.date)));
                }}
                onDelete={(date) => saveWeights(weights.filter(w => w.date !== date))}
                onApplyRecommendation={(newCals) => {
                  const protein = targets.protein;
                  const fat = Math.round(newCals * 0.3 / 9);
                  const carbs = Math.max(0, Math.round((newCals - protein * 4 - fat * 9) / 4));
                  saveTargets({ ...targets, calories: newCals, fat, carbs, mode: 'adjusted' });
                }} />
            )}
            {view === 'history' && (
              <HistoryView logs={logs} targets={targets} weights={weights}
                onEdit={(entry, date) => setEditEntry({ entry, date })}/>
            )}
            {view === 'settings' && (
              <SettingsView
                profile={profile} targets={targets} apiKey={apiKey}
                onProfile={saveProfile} onTargets={saveTargets} onApiKey={saveApiKey}
                onReset={() => { S.wipe(); window.location.reload(); }}
              />
            )}
          </div>

          <TabBar view={view} setView={setView} onAdd={() => { setAddInitialTab('photo'); setAddOpen(true); }} />

          {pendingPhotoRecovery && (
            <PhotoRecoveryBanner
              beacon={pendingPhotoRecovery}
              onPick={() => {
                recoveryTabRef.current = pendingPhotoRecovery.extra?.source?.startsWith('label') ? 'label' : 'food';
                setPendingPhotoRecovery(null);
                // Open gallery directly in the same user gesture
                recoveryFileRef.current?.click();
              }}
              onDismiss={() => setPendingPhotoRecovery(null)}
            />
          )}

          {/* App-level recovery picker: opens the gallery directly from the
              recovery banner tap, then routes the chosen file into the Photo
              or Label tab pre-loaded so it processes immediately. */}
          <input ref={recoveryFileRef} type="file" accept="image/*" style={{ display: 'none' }}
            onChange={(e) => {
              const f = e.target.files?.[0];
              if (!f) return;
              setAddInitialTab(recoveryTabRef.current === 'label' ? 'label' : 'photo');
              setAddInitialFile(f);
              setAddOpen(true);
              e.target.value = '';
            }}/>

          {addOpen && (
            <AddSheet
              apiKey={apiKey}
              favourites={favourites}
              logs={logs}
              initialTab={addInitialTab}
              initialFile={addInitialFile}
              onClose={() => { setAddOpen(false); setAddInitialFile(null); }}
              onSave={(entry) => { addEntry(entry); setAddOpen(false); setAddInitialFile(null); }}
              onSetApiKey={(k) => saveApiKey(k)}
              onRemoveFavourite={(id) => saveFavourites(favourites.filter(f => f.id !== id))}
              onUpsertFavourite={upsertFavourite}
            />
          )}

          {editEntry && (
            <EditSheet
              entry={editEntry.entry}
              date={editEntry.date}
              isFav={isFavourite(editEntry.entry)}
              apiKey={apiKey}
              onSetApiKey={(k) => saveApiKey(k)}
              onClose={() => setEditEntry(null)}
              onSave={(updates, newDate) => {
                updateEntry(editEntry.date, editEntry.entry.id, updates, newDate);
                setEditEntry(null);
              }}
              onDelete={() => {
                deleteEntry(editEntry.date, editEntry.entry.id);
                setEditEntry(null);
              }}
              onToggleFav={() => toggleFavourite(editEntry.entry)}
            />
          )}
        </div>
      );
    }

    // ====================== ONBOARDING ======================
    function Onboarding({ onComplete }) {
      const [data, setData] = useState({
        name: '',
        sex: 'male', age_years: 30, height_cm: 175, weight_kg: 75,
        activity: 'moderate', goal: 'maintain'
      });
      const preview = calcTargets(data);
      return (
        <div style={{ minHeight: '100vh', padding: '40px 24px' }} className="safe-top">
          <div style={{ maxWidth: 480, margin: '0 auto' }}>
            <div style={{ fontFamily: fonts.display, fontSize: 14, color: C.inkMuted, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 8 }}>
              Macro
            </div>
            <h1 style={{ fontFamily: fonts.display, fontSize: 44, fontWeight: 500, margin: '0 0 4px', letterSpacing: '-0.03em', lineHeight: 1 }}>
              Let's set
              <br/>
              <span style={{ fontStyle: 'italic', fontWeight: 400 }}>your numbers.</span>
            </h1>
            <p style={{ color: C.inkMuted, marginTop: 18, marginBottom: 32, lineHeight: 1.5 }}>
              Quick profile so we can suggest sensible targets. Adjust any time.
            </p>

            <Field label="Your name">
              <TextInput value={data.name} onChange={(v) => setData({...data, name: v})} placeholder="e.g. Julian"/>
            </Field>
            <Field label="Sex (for BMR calc)">
              <Pills value={data.sex} onChange={(v) => setData({...data, sex: v})}
                options={[{v:'male',l:'Male'},{v:'female',l:'Female'}]} />
            </Field>
            <Field label="Age">
              <NumberInput value={data.age_years} onChange={(v) => setData({...data, age_years: v})} suffix="years"/>
            </Field>
            <Field label="Height">
              <NumberInput value={data.height_cm} onChange={(v) => setData({...data, height_cm: v})} suffix="cm"/>
            </Field>
            <Field label="Current weight">
              <NumberInput value={data.weight_kg} onChange={(v) => setData({...data, weight_kg: v})} suffix="kg" step="0.1"/>
            </Field>
            <Field label="Activity level">
              <Select value={data.activity} onChange={(v) => setData({...data, activity: v})}
                options={Object.entries(ACTIVITY).map(([k,v]) => ({v:k, l:v.label}))} />
            </Field>
            <Field label="Goal">
              <Pills value={data.goal} onChange={(v) => setData({...data, goal: v})}
                options={[{v:'cut',l:'Lose'},{v:'maintain',l:'Maintain'},{v:'lean_bulk',l:'Lean gain'},{v:'bulk',l:'Bulk'}]} />
            </Field>

            {preview && (

    function FoodRow({ entry, onDelete, onEdit, isFav, onToggleFav }) {
      const lines = portionLines(entry.portion);
      const isList = lines.length > 1;
      const contentRef = useRef(null);
      const [open, setOpen] = useState(false);
      const drag = useRef({ startX: 0, startY: 0, startOffset: 0, dir: null, moved: false, dragging: false, lastOffset: 0 });
      const DELETE_W = 88;
      const COMMIT = 36;

      // Sync transform when `open` changes externally (e.g. tap to close)
      useEffect(() => {
        if (!contentRef.current) return;
        contentRef.current.style.transition = 'transform 200ms ease';
        contentRef.current.style.transform = open ? `translateX(${-DELETE_W}px)` : 'translateX(0)';
      }, [open]);

      const onTouchStart = (e) => {
        const t = e.touches[0];
        drag.current = {
          startX: t.clientX, startY: t.clientY,
          startOffset: open ? -DELETE_W : 0,
          dir: null, moved: false, dragging: true,
          lastOffset: open ? -DELETE_W : 0,
        };
        if (contentRef.current) contentRef.current.style.transition = 'none';
      };

      const onTouchMove = (e) => {
        if (!drag.current.dragging) return;
        const t = e.touches[0];
        const dx = t.clientX - drag.current.startX;
        const dy = t.clientY - drag.current.startY;
        // Decide gesture direction on first significant movement
        if (!drag.current.dir) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          drag.current.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        }
        if (drag.current.dir !== 'h') return;
        drag.current.moved = true;
        const next = Math.max(-DELETE_W, Math.min(0, drag.current.startOffset + dx));
        drag.current.lastOffset = next;
        if (contentRef.current) contentRef.current.style.transform = `translateX(${next}px)`;
      };

      const onTouchEnd = () => {
        if (!drag.current.dragging) return;
        drag.current.dragging = false;
        if (drag.current.dir !== 'h') return;
        if (contentRef.current) contentRef.current.style.transition = 'transform 200ms ease';
        // Snap based on direction of movement + threshold
        const delta = drag.current.lastOffset - drag.current.startOffset;
        let willOpen;
        if (drag.current.startOffset === 0) {
          willOpen = drag.current.lastOffset < -COMMIT; // moved enough left
        } else {
          willOpen = delta < COMMIT; // already open, only close if moved right enough
        }
        setOpen(willOpen);
      };

      const handleClick = (e) => {
        if (drag.current.moved) {
          e.preventDefault();
          e.stopPropagation();
          drag.current.moved = false;
          return;
        }
        if (open) { setOpen(false); return; }
        onEdit();
      };

      return (
        <div style={{
          position: 'relative', overflow: 'hidden', borderRadius: 14,
          background: C.red
        }}>
          {/* Delete background layer. Two taps: the first turns it into "Sure?" */}
          <ConfirmDelete
            onConfirm={onDelete}
            stopPropagation
            ariaLabel="Delete entry"
            style={{
              position: 'absolute', right: 0, top: 0, bottom: 0, width: DELETE_W,
              background: C.red, border: 'none', color: 'white',
              fontFamily: fonts.body, fontSize: 14, fontWeight: 500,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', letterSpacing: '0.01em'
            }}
            armedStyle={{ background: C.ink }}
            armedChildren="Sure?"
          >
            Delete
          </ConfirmDelete>
          {/* Sliding content: own card styling, fully opaque so red doesn't bleed at rest */}
          <div
            ref={contentRef}
            onTouchStart={onTouchStart}
            onTouchMove={onTouchMove}
            onTouchEnd={onTouchEnd}
            onClick={handleClick}
            style={{
              background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14,
              padding: 14, display: 'flex', alignItems: 'flex-start', gap: 12,
              position: 'relative', touchAction: 'pan-y', cursor: 'pointer',
              willChange: 'transform'
            }}
          >
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 500, marginBottom: 2, display: 'flex', alignItems: 'flex-start', gap: 6, flexWrap: 'wrap' }}>
                <span style={{ wordBreak: 'break-word', overflowWrap: 'anywhere' }}>{entry.name}</span>
                {isFav && <span style={{ color: C.accent, fontSize: 13, lineHeight: '20px' }}>★</span>}
              </div>
              {lines.length > 0 && (
                isList ? (
                  <ul style={{ margin: '4px 0 6px', paddingLeft: 16, fontSize: 12, color: C.inkSoft, lineHeight: 1.5, fontStyle: 'italic' }}>
                    {lines.map((l, i) => <li key={i} style={{ wordBreak: 'break-word', overflowWrap: 'anywhere' }}>{l}</li>)}
                  </ul>
                ) : (
                  <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2, marginBottom: 4, fontStyle: 'italic', wordBreak: 'break-word', overflowWrap: 'anywhere', lineHeight: 1.4 }}>
                    {lines[0]}
                  </div>
                )
              )}
              <div className="num display" style={{ fontSize: 20, fontWeight: 500, marginTop: 6, marginBottom: 2 }}>
                {Math.round(entry.calories)} <span style={{ fontSize: 11, color: C.inkSoft, fontFamily: fonts.body }}>kcal</span>
              </div>
              <div style={{ fontSize: 12, color: C.inkMuted }} className="num">
                P {Math.round(entry.protein)}g · C {Math.round(entry.carbs)}g · F {Math.round(entry.fat)}g
              </div>
            </div>
            <button onClick={(e) => { e.stopPropagation(); onEdit(); }} style={{
              ...iconBtnStyle, width: 30, height: 30, marginTop: 2, flexShrink: 0
            }} aria-label="Edit">
              <IconPencil size={13}/>
            </button>

        </div>
      );
    }

    const IconPencil = (p) => (<svg {...SvgBase(p)}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>);

    function SavedTab({ onSave, apiKey, onSetApiKey, favourites, logs, onRemoveFavourite, onUpsertFavourite }) {
      const [selected, setSelected] = useState(null);

      // Build recent unique items from logs (last 60 days, dedupe by name)
      const recent = useMemo(() => {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 60);
        const seen = new Set();
        const items = [];
        const allEntries = Object.entries(logs)
          .flatMap(([date, entries]) => (entries || []).map(e => ({ ...e, _date: date })))
          .filter(e => new Date(e._date + 'T00:00:00') >= cutoff)
          .sort((a, b) => (b.time || 0) - (a.time || 0));
        for (const e of allEntries) {
          const key = (e.name || '').trim().toLowerCase();
          if (!key || seen.has(key)) continue;
          // Skip if it's already in favourites
          const isFav = favourites.some(f => (f.name || '').trim().toLowerCase() === key);
          if (isFav) { seen.add(key); continue; }
          seen.add(key);
          items.push(e);
          if (items.length >= 30) break;
        }
        return items;
      }, [logs, favourites]);

      if (selected) {
        // Is the selected item one of the current favourites? Determined by id match.
        const existingFav = favourites.find(f => f.id === selected.id) || null;
        return (
          <SavedItemEditor
            item={selected}
            existingFav={existingFav}
            apiKey={apiKey}
            onSetApiKey={onSetApiKey}
            onCancel={() => setSelected(null)}
            onSave={(entry) => {
              const { id, _date, time, ...rest } = entry;
              // Deep-copy nested objects so the new log entry shares no
              // references with the saved favourite. Adding a log must never
              // be able to mutate the saved meal.
              const isolated = {
                ...rest,
                labelData: rest.labelData ? JSON.parse(JSON.stringify(rest.labelData)) : rest.labelData,
                source: rest.source || 'saved',
              };
              onSave(isolated);
              setSelected(null);
            }}
            onSaveTemplate={(updatedFav) => {
              // Update existing favourite (preserve id) OR create a new one
              const id = onUpsertFavourite({ ...updatedFav, id: existingFav?.id });
              setSelected(null);
              return id;
            }}
          />
        );
      }

      if (favourites.length === 0 && recent.length === 0) {
        return (
          <div style={{ ...cardStyle, textAlign: 'center', color: C.inkMuted, padding: '32px 20px' }}>
            <div style={{ fontSize: 14, marginBottom: 6 }}>No saved meals yet.</div>
            <div style={{ fontSize: 12, color: C.inkSoft }}>
              Tap the star on a logged item to favourite it, or log a few meals. Recent items appear here automatically.
            </div>
          </div>
        );
      }

      return (
        <div>
          {favourites.length > 0 && (
            <div>
              <div style={{ ...mutedStyle, marginBottom: 8 }}>★ Favourites</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 18 }}>
                {favourites.map(f => (
                  <SavedRow key={f.id} item={f} isFav
                    onPick={() => setSelected(f)}
                    onRemove={() => onRemoveFavourite(f.id)}/>
                ))}
              </div>
            </div>
          )}
          {recent.length > 0 && (
            <div>
              <div style={{ ...mutedStyle, marginBottom: 8 }}>Recent</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {recent.map((r, i) => (
                  <SavedRow key={r.id || i} item={r}
                    onPick={() => setSelected(r)}/>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Editor for the per-100g reference attached to a saved template.
