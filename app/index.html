<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4EFE6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Macro" />
  <title>Macro</title>

  <!-- Icon: real PNG files (required for Android standalone install) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- PWA manifest as a real file (data-URI manifests can't install a standalone app) -->
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #F4EFE6;
      --surface: #FBF8F2;
      --ink: #1B1815;
      --ink-muted: #6C655C;
      --ink-soft: #9B948A;
      --line: #E5DDD0;
      --accent: #C85A30;
      --accent-soft: #F3D9CC;
      --green: #587049;
      --red: #A8412C;
      --display: "Fraunces", "Times New Roman", serif;
      --body: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    body {
      font-family: var(--body);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-family: var(--display); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .display { font-family: var(--display); letter-spacing: -0.02em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes macroFocusPulse {
      0%   { transform: scale(1.4); opacity: 0; }
      30%  { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .animate-spin { animation: spin 1s linear infinite; }
    .view { animation: fadein 0.25s ease-out; }
    /* iOS PWA safe areas */
    .safe-top { padding-top: env(safe-area-inset-top, 0); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
    /* Number input chrome strip */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
